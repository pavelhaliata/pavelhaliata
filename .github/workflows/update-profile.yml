name: Update profile card

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - profile.json
      - assets/portrait*.txt
      - assets/portrait-layout.json
      - scripts/generate_profile.py
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Generate profile cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_profile.py

      - name: Save updated cards
        run: |
          if git diff --quiet -- README.md dark_mode.svg light_mode.svg assets/stats.json assets/contribution-cache.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md dark_mode.svg light_mode.svg assets/stats.json assets/contribution-cache.json
          git commit -m "Update profile card"
          git push
